name: generate-builds

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]
  workflow_dispatch:

jobs:
  build-switch:
    name: build-switch
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fix Git Directory Permissions
        run: |
          git config --global --add safe.directory '*'

      - name: Install Missing Switch Packages
        run: |
          dkp-pacman -Sy --noconfirm switch-libzip switch-sdl2 switch-zlib switch-bzip2 switch-libpng

      - name: Configure CMake
        run: |
          cmake -B build-switch -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=/opt/devkitpro/cmake/Switch.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DPROJECT_BUILD_TYPE=Release \
            -C /opt/devkitpro/cmake/Switch.cmake

      - name: Build Project
        run: |
          cmake --build build-switch --config Release

      - name: Upload Switch Artifact
        uses: actions/upload-artifact@v4
        with:
          name: soh-switch
          path: |
            build-switch/soh.nro
